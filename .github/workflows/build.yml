name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases that Mwanga's auto-update reads

env:
  # the speech engine's optional graphics-card add-ons are not used; don't download them
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The verse finder with the real speech model: generated speech → Whisper → references.
  listen:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - uses: actions/cache@v4
        with:
          path: .models
          key: whisper-models-v1
      - run: node scripts/listen-smoke.mjs fast
      - name: Same check with the larger model (report only)
        run: node scripts/listen-smoke.mjs better
        continue-on-error: true

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pushes to main publish a GitHub Release named after the version in package.json (v0.2.0, …).
      # Every installed Mwanga sees a new version as an update. If that version is already released,
      # electron-builder leaves the release alone, so raise the version number to ship an update.
      - name: Tag the version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "$V already tagged"
          else
            git tag "$V" && git push origin "$V"
          fi
      - name: Build and publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer (pull requests)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Mwanga-Windows-installer
          path: release/*.exe
          if-no-files-found: error
